<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         Add your table and your form here.
         <table>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
            <tr>
              <td>David A. Bednar</td>
              <td>In the Path of Their Duty</td>
              <td>BYU-Idaho</td>
              <td>2007</td>
            </tr>
            <tr>
              <td>Jeffrey R. Holland</td>
              <td>Remember Lot's Wife</td>
              <td>BYU</td>
              <td>2009</td>
            </tr>
            <tr>
              <td>Russell M. Nelson</td>
              <td>Choices for Eternity</td>
              <td>BYU</td>
              <td>2022</td>
            </tr>
         </table>
         <form>
            <div class="form-container">
              <label for="speaker">Speaker:</label>
              <input type="text" id="speaker" name="speaker">
              <label for="title">Title:</label>
              <input type="text" id="title" name="title">
              <label for="location">Location:</label>
              <input type="text" id="location" name="location">
              <label for="year">Year:</label>
              <input type="text" id="year" name="year">
            </div>
            <input type="submit" value="Add Devotional">
         </form>
      </div>
    </main>
  </div>
</body>
</html>
